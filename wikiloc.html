<!DOCTYPE html>
<html lang="es" class="bg-mm-cream">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikiloc - Modo Monte</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/scroll-restore.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'mm-terracotta': '#BD917E',
                        'mm-cream': '#F3Ece6',
                        'mm-beige': '#E6Dace',
                        'mm-sage': '#6D7561',
                        'mm-brown': '#8C5A3B',
                        'mm-bordo': '#844C43',
                        'mm-dark': '#393939',
                        'mm-footer': '#EAE0D5',
                    },
                    fontFamily: {
                        'arca-bold': ['"Arca Majora 3 Bold"', 'sans-serif'],
                        'arca-heavy': ['"Arca Majora 3 Heavy"', 'sans-serif'],
                        'body': ['"Nunito Sans"', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>

        @font-face {
            font-family: 'Arca Majora 3 Bold';
            src: url('./fonts/ArcaMajora3-Bold.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
        }

        @font-face {
            font-family: 'Arca Majora 3 Heavy';
            src: url('./fonts/ArcaMajora3-Heavy.otf') format('opentype');
            font-weight: 900;
            font-style: normal;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
        }
    </style>
</head>

<body class="antialiased min-h-screen w-full overflow-x-hidden flex flex-col md:flex-row">

    <a href="index.html"
        class="absolute top-4 left-4 md:top-8 md:left-8 z-50 bg-black/30 hover:bg-black/50 text-white rounded-full p-3 backdrop-blur-md transition-all duration-300 shadow-lg flex items-center justify-center">
        <i data-lucide="arrow-left" class="w-6 h-6"></i>
    </a>

    <div id="leftPane"
        class="w-full md:w-1/2 lg:w-[50%] h-[40dvh] md:h-screen relative bg-black transition-colors duration-500 overflow-hidden flex flex-col justify-center items-center">
        <img id="carouselImage" src="" alt="Wikiloc Modo Monte"
            class="w-full h-full object-cover transition-opacity duration-300">
    </div>

    <div id="rightPane"
        class="w-full md:w-1/2 lg:w-[50%] h-[60dvh] md:h-screen bg-mm-cream flex flex-col items-center py-4 px-5 md:p-8 lg:px-12 lg:py-4 2xl:p-12 overflow-y-auto relative">
        <div id="textContent"
            class="max-w-3xl w-full text-mm-brown text-center flex flex-col items-center justify-center transition-opacity duration-300 my-auto">
            
        </div>

        <div class="absolute bottom-8 right-8 z-20 flex gap-4">
            <button onclick="prevSlide()"
                class="bg-black/30 hover:bg-black/50 backdrop-blur-md text-white rounded-full p-3 transition-colors">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <button onclick="nextSlide()"
                class="bg-black/30 hover:bg-black/50 backdrop-blur-md text-white rounded-full p-3 transition-colors">
                <i data-lucide="chevron-right" class="w-6 h-6"></i>
            </button>
        </div>
    </div>

    <script>
        const slides = [
            {
                image: './images/Wikiloc/FRAN Y AMA.webp',
                isMap: false,
                html: `
                    <p class="text-sm md:text-3xl 2xl:text-4xl font-semibold mb-1">Descargá la app.</p>
                    <h1 class="text-5xl md:text-7xl 2xl:text-9xl font-arca-bold tracking-widest uppercase text-mm-brown mb-1 md:mb-2 2xl:mb-4">WIKILOC</h1>
                    <p class="text-xs md:text-xl 2xl:text-2xl font-semibold mb-2 md:mb-6 2xl:mb-8">Escaneá el QR<br>e ingresá en nuestro perfil!</p>
                    <div class="w-[140px] h-[140px] md:w-[320px] md:h-[320px] 2xl:w-[450px] 2xl:h-[450px] overflow-hidden flex items-center justify-center mb-2 md:mb-6 2xl:mb-10 mx-auto">
                        <img src="./images/Wikiloc/ICONO TREKKING-21.png" alt="QR Code" class="w-full h-full object-contain scale-[1.9]">
                    </div>
                    <p class="text-xs md:text-3xl 2xl:text-4xl font-semibold leading-snug">Registrate con tu cuenta<br>Y comenzá la aventura</p>
                `
            },
            {
                image: './images/Wikiloc/ICONO TREKKING-22.png',
                isMap: true,
                html: `
                    <div class="space-y-4 md:space-y-12 max-w-xl mx-auto text-sm md:text-2xl 2xl:text-3xl font-semibold leading-relaxed">
                        <p>
                            Para seguir los recorridos con<br>
                            todas las funciones se requiere la<br>
                            suscripción <span class="relative font-bold underline decoration-wavy decoration-2 underline-offset-8">
                                premium
                                <svg class="absolute right-0 md:-right-2 top-2 md:top-4 w-10 h-10 md:w-12 md:h-12 text-mm-brown translate-x-[60%] md:translate-x-[90%]" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M10 20 Q 60 10 80 60" />
                                    <path d="M80 60 L 90 40" />
                                    <path d="M80 60 L 60 50" />
                                </svg>
                                <span class="absolute right-0 md:-right-4 top-[180%] md:top-[160%] text-xs md:text-base 2xl:text-lg font-bold -rotate-6 whitespace-nowrap text-mm-brown translate-x-[30%] md:translate-x-[70%]">
                                    (tenes 14 días gratis)
                                </span>
                            </span>
                        </p>
                        
                        <p class="pt-2 md:pt-12">
                            Cuando seguís el track, Wikiloc<br>
                            comienza a grabar tu recorrido.
                        </p>

                        <p>
                            Te guía sobre nuestro track y se<br>
                            activaran alarmas sonoras si te<br>
                            desvias.
                        </p>

                        <p>
                            Sino podes ver las rutas<br>
                            y tomar referencias!
                        </p>
                    </div>
                `
            }
        ];

        let currentSlide = 0;

        function updateSlide() {
            const slide = slides[currentSlide];
            const textContent = document.getElementById('textContent');
            textContent.style.opacity = '0';
            const img = document.getElementById('carouselImage');
            const leftPane = document.getElementById('leftPane');
            const changingImage = img.src !== new URL(slide.image, document.baseURI).href;
            if (changingImage) {
                img.style.opacity = '0';
            }

            setTimeout(() => {
                textContent.innerHTML = slide.html;
                textContent.style.opacity = '1';

                if (changingImage) {
                    img.src = slide.image;
                    if (slide.isMap) {
                        img.className = "w-[90%] h-[90%] object-contain transition-opacity duration-300";
                        leftPane.className = "w-full md:w-1/2 lg:w-[50%] h-[40dvh] md:h-screen relative bg-mm-brown transition-colors duration-500 overflow-hidden flex flex-col justify-center items-center";
                    } else {
                        img.className = "w-full h-full object-cover transition-opacity duration-300";
                        leftPane.className = "w-full md:w-1/2 lg:w-[50%] h-[40dvh] md:h-screen relative bg-black transition-colors duration-500 overflow-hidden flex flex-col justify-center items-center";
                    }
                    img.style.opacity = '1';
                }
            }, 150);
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            updateSlide();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            updateSlide();
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateSlide();
            lucide.createIcons();
        });
    </script>
</body>

</html>
